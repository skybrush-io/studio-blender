name: Offline cross-platform tests

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  portable_tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install locked test dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Unit and portable subprocess tests (not Blender GUI acceptance)
        run: uv run --locked pytest -q -rs --junitxml=test-results.xml
      - name: Lint
        run: uv run --locked ruff check .
      - name: Formatting
        run: uv run --locked ruff format --check .
      - name: Retain pass, failure and skip evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
